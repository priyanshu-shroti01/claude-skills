# ════════════════════════════════════════════════════════════════════
# Claude OS — External Dependency Registry
# Consumed by scripts/bootstrap.sh / install.sh; human record in
# docs/dependencies.md (keep both in sync — verify.sh cross-checks refs).
#
# status: required | optional | evaluation | blocked
#   required   — bootstrap installs by default
#   optional   — bootstrap installs with --with-optional or per-component flag
#   evaluation — NEVER auto-installed; human evaluates first (docs note why)
#   blocked    — do not install; reason + alternative recorded
#
# All facts verified 2026-08-21 against the listed URLs (web research).
# Pins are the latest verified versions; update via scripts/update.sh
# after reviewing changelogs.
# ════════════════════════════════════════════════════════════════════

registry:

  # ── Core ──────────────────────────────────────────────────────────
  claude-mem:
    status: required
    url: https://github.com/thedotmack/claude-mem
    license: Apache-2.0
    version_pin: "13.15.3"
    install: "npx claude-mem@13.15.3 install"
    verify: "claude-mem status || test -d ~/.claude-mem"
    purpose: persistent memory layer (skills/core/memory)
    security_notes: >
      Installs session lifecycle hooks; stores full session activity in
      local SQLite/Chroma. Review its hooks post-install. Never let it
      capture secrets (secrets stay out of sessions per SECURITY.md).
    maintenance: active (verified 2026-08-20 push, v13.15.3 npm)

  graphify:
    status: required
    url: https://github.com/Graphify-Labs/graphify
    license: Apache-2.0
    version_pin: "0.9.48"
    install: "python3 -m pip install --user 'graphifyy==0.9.48' && graphify install"
    verify: "command -v graphify"
    purpose: codebase knowledge graph (skills/core/graph-knowledge)
    security_notes: >
      Local tree-sitter AST parsing, on-device, no vector store. Use the
      Graphify-Labs org repo ONLY — several similarly-named mirrors exist
      (rhanka/graphify, graphify.net are NOT canonical). The hosted
      app.graphify.com service is out of scope; local mode only.
    maintenance: active (verified 2026-08-20 push)

  superpowers:
    status: required
    url: https://github.com/obra/superpowers
    license: MIT
    version_pin: "v6.3.0"
    install: "claude plugin: /plugin install superpowers@claude-plugins-official"
    verify: "plugin listed in /plugin"
    purpose: engineering methodology skills (planning, TDD, debugging, worktrees)
    security_notes: reputable author (obra); plugin-marketplace distribution
    maintenance: active (v6.3.0 released 2026-08-12)

  skills-cli:
    status: required
    url: https://github.com/vercel-labs/skills
    license: MIT
    version_pin: "1.5.23"
    install: "npx -y skills@1.5.23 add vercel-labs/skills --skill find-skills --agent claude-code"
    verify: "npx skills --version; find-skills skill available"
    purpose: >
      the skills package manager (`npx skills find|add|update`) plus the
      find-skills discovery skill — how the OS discovers new capabilities
      in the open ecosystem (skills.sh)
    security_notes: >
      Official Vercel Inc., MIT, no hooks, no installer of its own — but
      it is an INSTALL VECTOR: find-skills recommends third-party skills
      and offers to run `npx skills add ... -g -y`. HARD RULE: discovery
      only. Anything it surfaces goes through SECURITY.md §4 (canonical
      source → license → maintenance → read what executes → pin → record
      here + docs/dependencies.md) BEFORE it is installed. Never let an
      agent run `skills add` unattended; never `-g -y` from a router
      decision. The skill's own quality heuristics (install counts,
      stars) are popularity, not an audit — they do not substitute for
      ours.
    maintenance: active (v1.5.23, npm 2026-08-19; verified 2026-09-05)

  anthropic-skills:
    status: required
    url: https://github.com/anthropics/skills
    license: "Apache-2.0 (most skills); docx/pdf/pptx/xlsx are source-available (custom license)"
    version_pin: rolling
    install: "/plugin marketplace add anthropics/skills; /plugin install example-skills@anthropic-agent-skills"
    verify: "frontend-design skill available"
    purpose: official Anthropic skills incl. frontend-design, webapp-testing, mcp-builder
    security_notes: first-party Anthropic; document skills' custom license noted for redistribution
    maintenance: active (official)

  # ── Design ────────────────────────────────────────────────────────
  vercel-agent-skills:
    status: required
    url: https://github.com/vercel-labs/agent-skills
    license: MIT
    version_pin: rolling
    install: "npx skills add vercel-labs/agent-skills (or copy selected skills)"
    verify: "react-best-practices + web-design-guidelines skills present"
    purpose: >
      8 Vercel Engineering skills. Adopted: react-best-practices,
      web-design-guidelines, vercel-composition-patterns,
      react-view-transitions, writing-guidelines, vercel-optimize.
      Not adopted by default: deploy-to-vercel and vercel-cli-with-tokens
      (L4/L5 deployment surface — deployment-gates owns that path).
    security_notes: >
      Official Vercel Labs; prose/reference skills, no hooks. NOTE the
      two deployment skills carry real blast radius: vercel-cli-with-tokens
      handles deploy tokens and deploy-to-vercel ships to an environment.
      Both are approval-gated by config/permissions/approval-required.yaml
      like any other deploy — never route them below L4.
      Distinct repo from vercel-labs/skills (the CLI) — see skills-cli.
    maintenance: active (verified 2026-09-05)

  impeccable:
    status: required
    url: https://github.com/pbakaus/impeccable
    license: Apache-2.0
    version_pin: rolling
    install: "/plugin marketplace add pbakaus/impeccable (canonical repo only — clones exist)"
    verify: "impeccable commands available in /plugin"
    purpose: design-language skill set, anti-pattern detection, live browser mode
    security_notes: >
      Canonical repo is pbakaus/impeccable (Paul Bakaus). Beware clone
      repos with similar names. Overlaps our internal anti-slop skill —
      see docs/architecture/skill-overlap.md for the division of labor.
    maintenance: active

  shadcn-ui:
    status: required
    url: https://github.com/shadcn-ui/ui
    license: MIT
    version_pin: "shadcn@latest (registry-based)"
    install: "per project: npx shadcn@latest init; MCP: config/mcp/shadcn.json"
    verify: "/mcp shows shadcn; components.json in project"
    purpose: component system raw material (skills/frontend/component-quality)
    security_notes: components copy into the project; first-party MCP
    maintenance: active (canonical)

  react-bits:
    status: optional
    url: https://github.com/DavidHDev/react-bits
    license: "MIT + Commons Clause v1.0 — NOT plain MIT"
    version_pin: rolling
    install: "per component: npx shadcn@latest add @react-bits/<Component>"
    verify: component renders in project
    purpose: animated React components
    security_notes: >
      LICENSE RESTRICTION: Commons Clause forbids selling/sublicensing/
      redistributing the components themselves. Fine inside client
      products; NEVER re-ship in a redistributed component library.
    maintenance: active

  motion-primitives:
    status: optional
    url: https://github.com/ibelick/motion-primitives
    license: MIT
    version_pin: rolling (beta)
    install: "per component from motion-primitives.com docs (copy-in)"
    verify: component renders in project
    purpose: motion components on Motion + Tailwind
    security_notes: beta — occasional breaking changes; components copy-in
    maintenance: active beta

  figma-mcp:
    status: optional
    url: https://developers.figma.com/docs/figma-mcp-server/
    license: proprietary Figma service (beta)
    version_pin: n/a (remote service)
    install: "config/mcp/figma.json (remote https://mcp.figma.com/mcp; OAuth via /mcp)"
    verify: "/mcp shows figma authenticated"
    purpose: design-to-code from Figma files
    security_notes: >
      PLAN GATING: full access needs a Dev/Full seat on Professional+
      plans; Starter/View seats are heavily limited. Free during beta,
      usage-based pricing planned.
    maintenance: official Figma product

  claude-design-skills:
    status: evaluation
    url: https://github.com/freshtechbro/claudedesignskills
    license: MIT
    version_pin: rolling
    install: "EVALUATE FIRST - /plugin marketplace add freshtechbro/claudedesignskills"
    verify: n/a until adopted
    purpose: 22 design skills + bundles (Three.js, GSAP, R3F, Rive, Spline)
    security_notes: >
      No canonical "Claude Design Skills" exists; this is the closest
      community match. Alternative: Owl-Listener/designer-skills. Vet
      skill prompts before granting to agents. Overlaps impeccable +
      internal design skills — adopt selectively, not wholesale.
    maintenance: active (community, individual)

  threeui:
    status: optional
    url: https://github.com/MengTo/threeui
    license: "MIT (Community code + ThreeUI-authored imagery); bundled fonts SIL OFL 1.1; bundled three.js MIT"
    version_pin: "@designcodeio/threeui 1.2.0"
    install: "per project: npm i @designcodeio/threeui@1.2.0 (or copy a Community component's source from threeui.com)"
    verify: component renders in project
    purpose: >
      procedural Three.js hero components, shaders and landing templates —
      raw material for r3f-scenes / 3d-director, in the same role
      React Bits plays for 2D (garnish, never a second design system)
    security_notes: >
      LICENSE SPLIT — read before shipping. MIT covers ONLY the Community
      (login-free) subset: application code, Community component code and
      ThreeUI-authored Community imagery. NOT MIT: catalog thumbnails and
      preview videos served from threeui.com (loaded remotely, never
      redistributed — do not copy them into a project), and Pro/Beta
      component source (paid, entitlement-checked, deliberately not on
      npm). ThreeUI's MCP server and skills are Pro-tier only — this
      entry covers the open component catalog, nothing else; do not
      register a Pro MCP without a paid seat and a fresh vetting pass.
      Bundled fonts are SIL OFL 1.1 (keep the notices); SF Pro is stripped
      from the public sync — don't reintroduce it. Components pull runtime
      files and some CDN libraries at render time; self-host what ships to
      production (SECURITY.md — no unpinned third-party origins in a
      client bundle) and keep them inside the project CSP.
      Two pinned three.js majors (0.128 + 0.165) live side by side in the
      package — check which one a copied component targets against the
      project's own three version before importing.
    maintenance: active (last push 2026-09-01; single maintainer, Meng To / Design+Code)

  awwwards-threejs:
    status: required
    url: https://www.awwwards.com/websites/three-js/
    license: "editorial gallery — each listed site is its own rights holder; no license grant of any kind"
    version_pin: living gallery
    install: "reference-only — LINK and look; never scrape, vendor, or copy"
    verify: n/a (no install)
    purpose: >
      curated gallery of award-level Three.js / WebGL sites — the visual
      reference source of record for 3D and scroll-cinematic briefs
      (research-agent, design-director, 3d-director, motion-director);
      catalogued with the rest in references/design/inspiration-sources.md
    security_notes: >
      NOT a dependency and NOT a source of code. Every site in the gallery
      is somebody's copyrighted work. Rules: reference the TECHNIQUE
      (scroll choreography, material behaviour, camera language, pacing),
      never the composition, copy, or assets. Never scrape the gallery or
      the sites it links; fetch a page only as an agent would view it, and
      obey robots.txt. A screenshot may enter a research packet as cited
      reference under fair use; it must never enter a shipped design.
      Awwwards is also a popularity signal, not a quality gate — the
      anti-slop gate and the project DESIGN.md still rule.
    maintenance: active (editorial, continuously updated)

  # ── Content / writing ─────────────────────────────────────────────
  no-ai-slop:
    status: required
    url: https://github.com/petergyang/no-ai-slop
    license: MIT
    version_pin: "1.0.6"
    install: "/plugin marketplace add petergyang/no-ai-slop; /plugin install no-ai-slop (or copy skills/no-ai-slop into ~/.claude/skills/)"
    verify: "no-ai-slop skill available"
    purpose: >
      the PROSE anti-slop ruleset — 20+ named AI writing patterns with
      edit and detect modes. Complements (does not overlap) the internal
      visual anti-slop gate: ours judges rendered UI, this judges copy.
      See docs/architecture/skill-overlap.md.
    security_notes: >
      Single SKILL.md + eval.md + an agent metadata yaml. No hooks, no
      network calls, no installer; the one script (scripts/build_plugin.py)
      only packages the repo and never runs at skill time. Ships a
      .codex-plugin/plugin.json rather than .claude-plugin/ — Claude Code
      auto-discovers skills/no-ai-slop/SKILL.md by default layout, so no
      manifest is needed. Named individual maintainer (Peter Yang) —
      bus-factor 1, but the surface is one prompt file you can read in
      full before adopting an update.
    maintenance: active (last push 2026-09-01; verified 2026-09-05)

  # ── Engineering / QA ─────────────────────────────────────────────
  mattpocock-skills:
    status: optional
    url: https://github.com/mattpocock/skills
    license: MIT
    version_pin: "plugin 1.2.3"
    install: "/plugin marketplace add mattpocock/skills; /plugin install mattpocock-skills@mattpocock — ADOPT SELECTIVELY (see purpose)"
    verify: "chosen skills listed in /plugin"
    purpose: >
      25 published engineering + productivity skills. Adopted for the
      capabilities our roster genuinely lacks: diagnosing-bugs,
      resolving-merge-conflicts, domain-modeling, to-spec, to-tickets,
      grill-me / grilling (adversarial self-questioning), teach,
      writing-for-agents. NOT adopted: code-review, research, implement,
      prototype, tdd, triage, codebase-design — those duplicate our
      code-reviewer agent, research-intelligence skill and Superpowers.
    security_notes: >
      MIT, very active, named maintainer. Mostly prose skills, but three
      ship shell: git-guardrails-claude-code installs a PreToolUse hook
      that BLOCKS git push/reset --hard/clean -f, and wizard +
      diagnosing-bugs ship template scripts. Read every one before
      enabling — a third-party hook in .claude/settings.json is exactly
      what security-rules.md forbids adding autonomously; the git-guardrails
      hook also overlaps our own .claude/hooks/pre-tool-guard.sh and must
      not be stacked on top of it. Installing the plugin wholesale pulls
      all 25 skills and violates the routing principle — cherry-pick the
      list above. skills/in-progress and skills/deprecated are explicitly
      unstable: never adopt from them.
    maintenance: active (last push 2026-09-04; 1000+ merged PRs)

  playwright-mcp:
    status: required
    url: https://github.com/microsoft/playwright-mcp
    license: Apache-2.0
    version_pin: "0.0.79"
    install: "config/mcp/playwright.json (npx @playwright/mcp@latest)"
    verify: "/mcp shows playwright"
    purpose: browser automation for qa/visual-qa (PRIMARY browser harness)
    security_notes: official Microsoft; accessibility-snapshot driven
    maintenance: active

  agent-browser:
    status: evaluation
    url: https://github.com/vercel-labs/agent-browser
    license: Apache-2.0
    version_pin: "0.34.0"
    install: "EVALUATE FIRST - npm install -g agent-browser && agent-browser install"
    verify: n/a until adopted
    purpose: alternative browser harness (Rust CLI + CDP, low-token snapshots)
    security_notes: >
      Overlaps playwright-mcp — the overlap ruling (skill-overlap.md)
      selects Playwright MCP as primary; do not run both as defaults.
    maintenance: active (Vercel Labs experimental)

  lighthouse:
    status: required
    url: https://github.com/GoogleChrome/lighthouse
    license: Apache-2.0
    version_pin: "13.4.1"
    install: "npm install -g lighthouse@13.4.1"
    verify: "lighthouse --version"
    purpose: performance/SEO/a11y measurement (performance-agent)
    security_notes: Google-maintained; standard tooling
    maintenance: active

  # ── Security (reference-only) ────────────────────────────────────
  owasp-cheatsheets:
    status: required
    url: https://github.com/OWASP/CheatSheetSeries
    license: "CC-BY-SA-4.0 — NOT MIT; copyleft for content"
    version_pin: living document
    install: "reference-only — LINK, never vendor text into this MIT repo"
    verify: n/a (no install)
    purpose: security reference of record (references/security/)
    security_notes: >
      LICENSE: copied/derived text must credit OWASP and carry CC-BY-SA.
      We therefore link (cheatsheetseries.owasp.org) instead of vendoring.
    maintenance: active

  # ── SEO ───────────────────────────────────────────────────────────
  superseo-skills:
    status: optional
    url: https://github.com/inhouseseo/superseo-skills
    license: Apache-2.0
    version_pin: "0.2.1"
    install: "/plugin marketplace add inhouseseo/superseo-skills; /plugin install superseo@superseo-skills"
    verify: "page-audit + write-content skills available"
    purpose: >
      11 execution-level SEO skills the internal baseline does not cover —
      content-brief, write-content, improve-content, keyword-deep-dive,
      semantic-gap-analysis, eeat-audit, topic-cluster-planning,
      featured-snippet-optimizer, linkbuilding, expert-interview,
      page-audit. The adopted external SEO layer on top of internal
      technical-seo + geo (which remain the gate). Supersedes claude-seo —
      see docs/architecture/skill-overlap.md.
    security_notes: >
      Prompt-only: 11 SKILL.md files + reference markdown, zero
      executables, no hooks, no package manifest, no API keys, no paid
      tier required (verified by clone + tree inspection 2026-09-05).
      Ships its own SECURITY.md and disclosure address. At skill time the
      agent only uses tools the user already granted (web search/fetch);
      write-content may offer to persist business context to a file the
      user names — that is the only write, and it asks first.
      VENDOR BIAS: authored by InhouseSEO, who sell a paid SEO platform
      the README markets. The skills work standalone, but treat their
      methodology claims as vendor opinion, not established fact, and
      never let a skill's recommendation become a reason to buy the
      platform. YOUNG: v0.2.1, ~51 commits, ~305 stars — capable but not
      battle-hardened; re-verify provenance on each update.
      linkbuilding teaches acquisition tactics: guest posting and outreach
      stay human-executed and approval-gated exactly like lead-research —
      an agent never contacts anyone, and nothing here authorizes buying
      links or building private blog networks.
    maintenance: active (v0.2.1 released 2026-09-03; single org maintainer)

  claude-seo:
    status: evaluation
    url: https://github.com/AgriciDaniel/claude-seo
    license: MIT
    version_pin: "v2.2.4"
    install: "DO NOT INSTALL by default — superseded by superseo-skills (skill-overlap.md ruling)"
    verify: n/a until adopted
    purpose: (superseded) 25 SEO sub-skills + 18 sub-agents (technical, schema, GEO/AEO)
    security_notes: >
      Single-maintainer bus-factor; optional PAID extensions (DataForSEO,
      Firecrawl) where superseo-skills needs no keys at all. 25 skills +
      18 sub-agents is a far larger unaudited prompt surface than the
      capability gap justifies. Superseded 2026-09-05 by superseo-skills
      (Apache-2.0, prompt-only, zero executables, no paid dependency) as
      the external SEO layer. Internal technical-seo + geo remain the
      gate either way. Revisit only if superseo-skills stalls.
    maintenance: active (single maintainer)

  # ── 3D / Motion ──────────────────────────────────────────────────
  react-three-fiber:
    status: optional
    url: https://github.com/pmndrs/react-three-fiber
    license: MIT
    version_pin: "9.7.0"
    install: "per project: npm i three @react-three/fiber@9"
    verify: project builds with a Canvas
    purpose: React renderer for Three.js (skills/3d/r3f-scenes)
    security_notes: "React 19 requires fiber v9 line"
    maintenance: active (pmndrs)

  drei:
    status: optional
    url: https://github.com/pmndrs/drei
    license: MIT
    version_pin: "10.7.8"
    install: "per project: npm i @react-three/drei@10"
    verify: imports resolve
    purpose: R3F helper library (pairs with fiber v9)
    security_notes: none
    maintenance: active (pmndrs)

  gsap:
    status: optional
    url: https://github.com/greensock/GSAP
    license: "GSAP Standard 'no charge' license (Webflow-owned; custom, not OSI)"
    version_pin: "3.x (>=3.13)"
    install: "per project: npm i gsap"
    verify: imports resolve
    purpose: timeline-heavy narrative animation (motion-director tooling)
    security_notes: >
      100% free incl. former Club plugins since 3.13 (Webflow). License
      restrictions: no use inside no-code animation builders competing
      with Webflow; keep proprietary notices.
    maintenance: active (Webflow)

  lets-scroll:
    status: optional
    url: https://github.com/AIwithhassan/lets-scroll
    license: MIT
    version_pin: "rolling (plugin.json v0.8.0)"
    install: "/plugin marketplace add AIwithhassan/lets-scroll; /plugin install lets-scroll@lets-scroll (or copy skills/lets-scroll into ~/.claude/skills/)"
    verify: "/lets-scroll skill available"
    purpose: >
      scroll-scrubbed cinematic "fly through the world" landing pages —
      the PRIMARY scroll-cinematic skill (supersedes scroll-world; see
      docs/architecture/skill-overlap.md)
    security_notes: >
      Single SKILL.md + references (scrub engine, prompt templates,
      pipeline scripts, knockout.py) — no installer, no hooks. Generation
      costs real money: Monid pay-per-clip USD by default (N=6 1080p
      chain ≈ $27) with Higgsfield credits as fallback; the skill states
      the estimated total and gets approval before any spend — hold it to
      that. Requires ffmpeg; a manual asset path needs no AI CLIs at all.
      Both CLIs authenticate via their own login flows — no keys in this
      repo. No tagged releases; repo owner (AIwithhassan) differs from
      the plugin author (cyw) — re-verify provenance on update.
    maintenance: active (verified 2026-08-23; last push 2026-08-15)

  scroll-world:
    status: evaluation
    url: https://github.com/oso95/scroll-world
    license: MIT
    version_pin: rolling
    install: "DO NOT INSTALL by default — superseded by lets-scroll (skill-overlap.md ruling)"
    verify: n/a until adopted
    purpose: (superseded) scroll-scrubbed video fly-through landing pages
    security_notes: >
      NOT an R3F library — generates scroll-scrubbed AI video pages.
      Requires paid third-party generation services (per-clip billing) +
      ffmpeg. Young project (2026-07). Name collides with unrelated repos.
      Superseded 2026-08-23 by lets-scroll (same concept, more mature:
      seam frame-locking, manual asset path, native mobile chain).
      Revisit only if lets-scroll stalls.
    maintenance: young, active-ish

  # ── Media generation ─────────────────────────────────────────────
  claude-image-gen:
    status: evaluation
    url: https://github.com/guinacio/claude-image-gen
    license: MIT
    version_pin: rolling
    install: "EVALUATE FIRST - /plugin install guinacio/claude-image-gen"
    verify: n/a until adopted
    purpose: image generation skill/MCP (Gemini + OpenAI providers)
    security_notes: >
      Small community project (low traction). Requires your own API keys
      (cost). Fits our provider abstraction (config/providers/media.yaml).
      Alternatives exist (shipdeckai/image-gen).
    maintenance: unclear (low activity)

  omni-skill-claude:
    status: evaluation
    url: https://github.com/xbill9/omni-skill-claude
    license: Apache-2.0
    version_pin: rolling
    install: "REFERENCE ONLY — do not depend on it"
    verify: n/a
    purpose: video generation reference (Gemini video APIs)
    security_notes: >
      0 stars / 1 commit — a personal demo with zero community vetting.
      Treat as reference code for our own video pipeline, not a
      dependency. Alternative: SamurAIGPT/Generative-Media-Skills.
    maintenance: effectively unmaintained

  # ── Growth ────────────────────────────────────────────────────────
  scout:
    status: blocked
    url: https://github.com/kiryano/Scout
    license: MIT
    version_pin: n/a
    install: "DO NOT INSTALL"
    verify: n/a
    purpose: (evaluated) lead-gen scraping tool
    security_notes: >
      STATUS: BLOCKED.
      REASON: scrapes Instagram/TikTok/LinkedIn etc. against platform
      ToS; harvests + SMTP-probes personal emails (GDPR/CAN-SPAM and
      IP-blacklisting exposure); no legal disclaimers; stale (~6 months,
      no releases, "early access").
      ALTERNATIVE: skills/growth/lead-research — lawful manual public-data
      research with approval-gated, human-executed outreach.
    maintenance: stale (last push 2026-02-22)

  # ── Orchestration (evaluation) ───────────────────────────────────
  ruflo:
    status: evaluation
    url: https://github.com/ruvnet/ruflo
    license: MIT
    version_pin: "3.38.12"
    install: "EVALUATE IN SANDBOX FIRST - npx ruflo@latest init"
    verify: n/a until adopted
    purpose: multi-agent orchestration meta-harness (claude-flow rebrand)
    security_notes: >
      Very large attack/complexity surface: executes shell commands,
      installs 27-hook system + MCP servers, cross-machine federation.
      Benchmark claims are self-reported. Claude OS's workflows + native
      subagents cover current needs — adopt only if a concrete gap
      appears, and only after sandboxed evaluation.
    maintenance: very active

  gstack:
    status: evaluation
    url: https://github.com/garrytan/gstack
    license: MIT
    version_pin: rolling (VERSION file in repo)
